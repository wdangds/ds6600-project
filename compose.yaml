# Local development only. Render deploys from the Dockerfile and
# provides its own database connection.

services:
  app:
    image: ds6600project_image
    ports:
      - "8050:8050"
    volumes:
      - .:/ds6600-project

  postgres:
    image: postgres:latest
    ports: 
      - "5432:5432"
    volumes:
      
    