# Local development only. Render deploys from the Dockerfile and
# provides its own database connection.

services:
  app:
    image: ds6600project_image
    ports:
      - "8050:8050"
    volumes:
      - .:/ds6600-project
    networks:
      - dbnetwork

  postgres:
    image: postgres:18.6
    ports: 
      - "5432:5432"
    volumes:
      - postgresdata:/var/lib/postgresql/18/docker
    env_file:
      - .env
    networks:
      - dbnetwork

  neo4j:
    image: neo4j:2026.07.1-community-trixie
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    env_file:
      - .env
    networks:
      - dbnetwork
volumes:
  postgresdata:
  neo4jdata:

networks:
  dbnetwork:
    